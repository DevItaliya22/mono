[package]
rust-version.workspace = true
name = "koru-native-notifications"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Koru-owned contract for desktop notification delivery adapters."

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "ApplicationModel",
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_WinRT",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.5.1"
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSEnumerator", "NSError", "NSSet", "NSString"] }
objc2-user-notifications = { version = "0.2.2", features = ["all"] }
