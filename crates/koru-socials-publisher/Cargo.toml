[package]
rust-version.workspace = true
name = "koru-socials-publisher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
koru-socials = { path = "../koru-socials" }
koru-socials-store = { path = "../koru-socials-store" }
koru-socials-x = { path = "../koru-socials-x" }
koru-socials-auth = { path = "../koru-socials-auth" }
koru-socials-reddit = { path = "../koru-socials-reddit" }
koru-socials-linkedin = { path = "../koru-socials-linkedin" }
koru-api-client = { path = "../koru-api-client" }
koru-store-core = { path = "../koru-store-core" }
koru-channel = { path = "../koru-channel" }
loro.workspace = true
uuid.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rusqlite.workspace = true
fs2.workspace = true
tracing.workspace = true

[features]
default = []
no-network = ["koru-socials-x/no-network", "koru-socials-reddit/no-network", "koru-socials-linkedin/no-network"]
