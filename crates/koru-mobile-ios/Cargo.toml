[package]
rust-version.workspace = true
name = "koru-mobile-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "iOS C-ABI shim over koru-mobile-host. Marshalling only; generated Protobuf defines the contract."

[lib]
name = "koru_mobile_ios"
