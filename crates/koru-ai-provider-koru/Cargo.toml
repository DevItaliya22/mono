[package]
rust-version.workspace = true
name = "koru-ai-provider-koru"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Hosted Koru AI Chat Completions adapter."

[dependencies]
bytes.workspace = true
futures-util = { workspace = true, features = ["async-await"] }
koru-ai-core = { path = "../koru-ai-core" }
koru-ai-transport = { path = "../koru-ai-transport" }
koru-env = { path = "../koru-env" }
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
koru-ai-transport = { path = "../koru-ai-transport", features = ["test-server"] }
