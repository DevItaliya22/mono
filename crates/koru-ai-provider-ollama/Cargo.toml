[package]
rust-version.workspace = true
name = "koru-ai-provider-ollama"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Native Ollama provider adapter for Koru AI."

[dependencies]
bytes.workspace = true
futures-util = { workspace = true, features = ["async-await"] }
koru-ai-core = { path = "../koru-ai-core" }
koru-ai-transport = { path = "../koru-ai-transport" }
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
koru-ai-transport = { path = "../koru-ai-transport", features = ["test-server"] }
