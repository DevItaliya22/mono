[package]
rust-version.workspace = true
name = "koru-api-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Desktop host for Koru's public API gateway and embedded domain workers."

# **A library, and nothing else.** There is no `[[bin]]`, no `build.rs` and no
# `koru-winres`: `koru-api-gateway.exe` was retired in Plan 7 of the Gateway
# worker roadmap, and the only host that drives this composition is
# `koru-agent.exe --worker gateway`. A package with no binary target has no
# executable to stamp a Windows resource onto.

[dependencies]
# The Artifact Store the gateway worker hosts (D13): the SQLite database
# and the service over it, composed beside the AI worker.
koru-artifact-api = { path = "../koru-artifact-api" }
koru-artifact-sqlite = { path = "../koru-artifact-sqlite" }
# `LocalDelegate`: the transport the desktop host hands `/v1/runs` (D12).
koru-delegate-api = { path = "../koru-delegate-api" }
# The registry, for the one `.env` read at startup -- a developer convenience
# that refuses a key it does not know rather than ignoring it. Called by
# whichever host drives this crate, before it builds a runtime.
koru-env = { path = "../koru-env" }
koru-events-server = { path = "../../apps/koru-events-server" }
axum.workspace = true
koru-ai-server = { path = "../../apps/koru-ai-server" }
koru-api-discovery = { path = "../koru-api-discovery", features = ["server"] }
koru-api-client = { path = "../koru-api-client" }
koru-api-gateway-core = { path = "../koru-api-gateway-core" }
# The startup entry, for the `start_on_login` port this process installs. The
# same crate the Koru Store registers through, so there is one implementation of
# the Run key rather than two — and one answer to which value name is whose.
koru-autostart = { path = "../koru-autostart" }
koru-api-wire = { path = "../koru-api-wire" }
koru-channel = { path = "../koru-channel" }
koru-network-bridge = { path = "../koru-network-bridge" }
koru-ipc = { path = "../koru-ipc" }
koru-store-server = { path = "../../apps/koru-store-server" }
koru-session-protocol = { path = "../koru-session-protocol" }
# The settings authority. This process hosts it: it resolves the locations and
# hands it down once, before serving.
koru-settings = { path = "../koru-settings" }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# **What is left is what the colocated tests need**, which is much less than
# before: the six integration suites that lived in `tests/` moved to
# `apps/koru-agent/tests/` with the executable they spawned, in Plan 7 of the
# Gateway worker roadmap. `src/bootstrap/tests.rs` and
# `src/composition/settings/tests.rs` are what remain, and they open nothing.
#
# **`no-sink` stays.** The settings composition test builds a real events
# worker, and that worker constructs the configured telemetry sink without being
# asked to; `cfg(test)` in this crate cannot reach a dependency's build.
koru-events-server = { path = "../../apps/koru-events-server", features = ["no-sink"] }
tempfile.workspace = true
