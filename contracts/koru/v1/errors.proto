syntax = "proto3";

package koru.v1;

option java_multiple_files = true;
option java_package = "app.koru.contract.v1";
option swift_prefix = "KOR";

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_NOT_FOUND = 1;
  ERROR_CODE_PERMISSION_DENIED = 2;
  ERROR_CODE_UNAVAILABLE = 3;
  ERROR_CODE_INVALID_DATA = 4;
  ERROR_CODE_UNSUPPORTED = 5;
  ERROR_CODE_UNKNOWN = 6;
}

message ServiceError {
  ErrorCode code = 1;
  // Diagnostic only. Applications branch on code, never on this string.
  string detail = 2;
}
