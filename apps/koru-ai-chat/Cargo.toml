[package]
rust-version.workspace = true
name = "koru-ai-chat"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Standalone desktop host for the reusable Koru AI chat surface."

[[bin]]
name = "koru-ai-chat"
path = "src/main.rs"

[dependencies]
koru-ai-provider = { path = "../../crates/koru-ai-provider" }
koru-ai-core = { path = "../../crates/koru-ai-core" }
koru-ai-ui = { path = "../../crates/koru-ai-ui" }
# The working-folder picker of an agent chat is the window's native dialog,
# as it is in the workspace host.
rfd = "0.15"
# The settings authority, through the one client every window uses. This
# window used to parse `preferences.conf` itself — twice, once for its
# appearance and once for dictation. See ADR-266.
koru-api-client = { path = "../../crates/koru-api-client" }
# The Settings surface this window opens from its menu — Global and AI (R6).
# It holds no link of its own here: the window has had a `GlobalLink` since
# SP-6b and feeds the section down.
koru-settings-ui = { path = "../../crates/koru-settings-ui" }
koru-settings = { path = "../../crates/koru-settings" }
koru-i18n = { path = "../../crates/koru-i18n" }
koru-channel = { path = "../../crates/koru-channel" }
koru-dictation = { path = "../../crates/koru-dictation" }
koru-link = { path = "../../crates/koru-link" }
koru-log = { path = "../../crates/koru-log" }
koru-ipc = { path = "../../crates/koru-ipc" }
koru-agent-wire = { path = "../../crates/koru-agent-wire" }
koru-update = { path = "../../crates/koru-update" }
koru-voice-consent = { path = "../../crates/koru-voice-consent" }
image = { version = "0.25", default-features = false, features = ["png"] }
tracing.workspace = true
uuid.workspace = true
koru-core = { path = "../../crates/koru-core" }
koru-draw = { path = "../../crates/koru-draw" }
koru-keys = { path = "../../crates/koru-keys" }
koru-ui = { path = "../../crates/koru-ui" }
koru-window = { path = "../../crates/koru-window" }
vello.workspace = true
winit.workspace = true

[build-dependencies]
koru-winres = { path = "../../crates/koru-winres" }

[dev-dependencies]
koru-ai-ui = { path = "../../crates/koru-ai-ui", features = ["no-client"] }
koru-dictation = { path = "../../crates/koru-dictation", features = ["no-engine"] }
