name: Bug report
description: Something in Koru does not work as it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **If this is a security problem, stop here** and email security@koru.do instead ([SECURITY.md](https://github.com/koruworks/mono/blob/main/SECURITY.md)).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Open a document
        2. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Android
        - macOS
        - iOS
        - Other
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which build
      options:
        - Official release (stable)
        - Official beta or nightly
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The version in the `VERSION` file beside the executables, or the commit you built.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Anything that helps. Please remove personal content and credentials first.
      render: text
